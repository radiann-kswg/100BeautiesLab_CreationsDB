name: Notify AI Dataset Repo

on:
  push:
    branches:
      - addon-ai-tag

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger AI dataset sync
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.AI_DATASET_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/radiann-kswg/100BeautiesLab_CreationsAI/dispatches \
            -d '{"event_type":"creations-db-updated"}'
