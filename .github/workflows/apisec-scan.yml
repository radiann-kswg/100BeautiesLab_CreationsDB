name: APIsec

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  schedule:
    - cron: "36 0 * * 2"
  workflow_dispatch:
    inputs:
      apisec_project:
        description: "APIsec 上のプロジェクト名。未指定時は Repository Variable APISEC_PROJECT を使用"
        required: false
        type: string
      apisec_profile:
        description: "スキャンプロファイル名。未指定時は APISEC_PROFILE または Master を使用"
        required: false
        default: ""
        type: string
      apisec_region:
        description: "任意のスキャナリージョン。未指定時は APISEC_REGION を使用"
        required: false
        default: ""
        type: string
      apisec_host:
        description: "任意の APIsec ホスト URL。未指定時は APISEC_HOST または action の既定値を使用"
        required: false
        default: ""
        type: string
      openapi_spec_url:
        description: "任意の OpenAPI Spec URL。指定時は APIsec へ登録/更新してからスキャン"
        required: false
        default: ""
        type: string
      refresh_playbooks:
        description: "既存プロジェクトの playbooks を更新してからスキャンする"
        required: false
        default: false
        type: boolean
      fail_on_vuln_severity:
        description: "任意の失敗閾値。指定した重大度以上の脆弱性でジョブを失敗させる"
        required: false
        default: none
        type: choice
        options:
          - none
          - Critical
          - High
          - Medium

permissions:
  contents: read

jobs:
  trigger_apisec_scan:
    name: Trigger APIsec scan
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APISEC_USERNAME: ${{ secrets.APISEC_USERNAME || secrets.apisec_username }}
      APISEC_PASSWORD: ${{ secrets.APISEC_PASSWORD || secrets.apisec_password }}
      APISEC_PROJECT: ${{ github.event.inputs.apisec_project || vars.APISEC_PROJECT }}
      APISEC_PROFILE: ${{ github.event.inputs.apisec_profile || vars.APISEC_PROFILE || 'Master' }}
      APISEC_REGION: ${{ github.event.inputs.apisec_region || vars.APISEC_REGION }}
      APISEC_HOST: ${{ github.event.inputs.apisec_host || vars.APISEC_HOST }}
      APISEC_OPENAPI_SPEC_URL: ${{ github.event.inputs.openapi_spec_url || vars.APISEC_OPENAPI_SPEC_URL }}
      APISEC_REFRESH_PLAYBOOKS: ${{ github.event.inputs.refresh_playbooks || vars.APISEC_REFRESH_PLAYBOOKS || 'false' }}
      APISEC_FAIL_ON_VULN_SEVERITY: ${{ github.event.inputs.fail_on_vuln_severity || vars.APISEC_FAIL_ON_VULN_SEVERITY || 'none' }}
      APISEC_EMAIL_REPORT: ${{ vars.APISEC_EMAIL_REPORT || 'false' }}
      APISEC_SARIF_FILE: apisec-results.sarif

    steps:
      - name: Validate APIsec configuration
        id: config
        shell: bash
        run: |
          missing=()

          if [ -z "$APISEC_USERNAME" ]; then
            missing+=("secret APISEC_USERNAME または apisec_username")
          fi

          if [ -z "$APISEC_PASSWORD" ]; then
            missing+=("secret APISEC_PASSWORD または apisec_password")
          fi

          if [ -z "$APISEC_PROJECT" ]; then
            missing+=("workflow_dispatch input apisec_project または repository variable APISEC_PROJECT")
          fi

          refresh_value=$(printf '%s' "$APISEC_REFRESH_PLAYBOOKS" | tr '[:upper:]' '[:lower:]')
          if [ -z "$refresh_value" ]; then
            refresh_value=false
          fi

          case "$refresh_value" in
            true|false)
              ;;
            *)
              echo "APISEC_REFRESH_PLAYBOOKS は true / false を指定してください: $APISEC_REFRESH_PLAYBOOKS" >&2
              exit 1
              ;;
          esac

          if [ "$APISEC_FAIL_ON_VULN_SEVERITY" = "none" ]; then
            APISEC_FAIL_ON_VULN_SEVERITY=
          fi

          if [ -n "$APISEC_FAIL_ON_VULN_SEVERITY" ]; then
            case "$APISEC_FAIL_ON_VULN_SEVERITY" in
              Critical|High|Medium)
                ;;
              *)
                echo "APISEC_FAIL_ON_VULN_SEVERITY は Critical / High / Medium のいずれかを指定してください: $APISEC_FAIL_ON_VULN_SEVERITY" >&2
                exit 1
                ;;
            esac
          fi

          if [ -n "$APISEC_HOST" ]; then
            case "$APISEC_HOST" in
              http://*|https://*)
                ;;
              *)
                echo "APISEC_HOST は http:// または https:// から始まる URL を指定してください: $APISEC_HOST" >&2
                exit 1
                ;;
            esac

            APISEC_HOST="${APISEC_HOST%/}"
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### APIsec scan skipped"
              echo
              echo "Missing required configuration:"
              for item in "${missing[@]}"; do
                echo "- $item"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          register_project=false
          if [ -n "$APISEC_OPENAPI_SPEC_URL" ]; then
            register_project=true
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "project=$APISEC_PROJECT" >> "$GITHUB_OUTPUT"
          echo "profile=$APISEC_PROFILE" >> "$GITHUB_OUTPUT"
          echo "region=$APISEC_REGION" >> "$GITHUB_OUTPUT"
          echo "host=$APISEC_HOST" >> "$GITHUB_OUTPUT"
          echo "openapi_spec_url=$APISEC_OPENAPI_SPEC_URL" >> "$GITHUB_OUTPUT"
          echo "refresh_playbooks=$refresh_value" >> "$GITHUB_OUTPUT"
          echo "register_project=$register_project" >> "$GITHUB_OUTPUT"
          echo "fail_on_vuln_severity=$APISEC_FAIL_ON_VULN_SEVERITY" >> "$GITHUB_OUTPUT"
          echo "email_report=$APISEC_EMAIL_REPORT" >> "$GITHUB_OUTPUT"

          {
            echo "### APIsec scan configuration"
            echo
            echo "- Project: $APISEC_PROJECT"
            echo "- Profile: $APISEC_PROFILE"
            if [ -n "$APISEC_HOST" ]; then
              echo "- Host: $APISEC_HOST"
              case "$APISEC_HOST" in
                *apisecapps.com)
                  echo "- Warning: この Host はブラウザ UI 用ホストの可能性があります。/login が HTML を返す場合、API 用ホスト https://cloud.apisec.ai の利用確認が必要です"
                  ;;
              esac
            fi
            if [ -n "$APISEC_REGION" ]; then
              echo "- Region: $APISEC_REGION"
            fi
            if [ -n "$APISEC_OPENAPI_SPEC_URL" ]; then
              echo "- OpenAPI spec registration/update: enabled"
            else
              echo "- OpenAPI spec registration/update: disabled"
            fi
            echo "- Refresh playbooks: $refresh_value"
            if [ -n "$APISEC_FAIL_ON_VULN_SEVERITY" ]; then
              echo "- Fail on vulnerability severity: $APISEC_FAIL_ON_VULN_SEVERITY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger APIsec scan
        id: apisec
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/apisec-inc/apisec-run-scan/v1.0.7/apisec-run-scan.sh -o apisec-run-scan.sh
          chmod +x apisec-run-scan.sh

          cmd=(
            ./apisec-run-scan.sh
            --username "$APISEC_USERNAME"
            --password "$APISEC_PASSWORD"
            --project "${{ steps.config.outputs.project }}"
            --profile "${{ steps.config.outputs.profile }}"
            --scanner "${{ steps.config.outputs.region }}"
            --outputfile "$APISEC_SARIF_FILE"
            --refresh-playbooks "${{ steps.config.outputs.refresh_playbooks }}"
            --emailReport "${{ steps.config.outputs.email_report }}"
            --fail-on-vuln-severity "${{ steps.config.outputs.fail_on_vuln_severity }}"
            --openAPISpecUrl "${{ steps.config.outputs.openapi_spec_url }}"
          )

          if [ -n "${{ steps.config.outputs.host }}" ]; then
            cmd+=(--host "${{ steps.config.outputs.host }}")
          fi

          "${cmd[@]}"

      - name: Detect SARIF output
        id: sarif
        if: always() && steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -f "$APISEC_SARIF_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "### APIsec SARIF" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "- SARIF file generated: $APISEC_SARIF_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### APIsec SARIF" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "- SARIF file was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APIsec SARIF
        if: always() && steps.config.outputs.ready == 'true' && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.APISEC_SARIF_FILE }}
          category: apisec

      - name: Fail workflow when APIsec scan fails
        if: always() && steps.config.outputs.ready == 'true' && steps.apisec.outcome == 'failure'
        shell: bash
        run: |
          echo "APIsec scan failed. Review the APIsec step log and uploaded SARIF results." >&2
          exit 1
